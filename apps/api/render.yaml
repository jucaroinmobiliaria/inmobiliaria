# Blueprint de Render para la API de Jucaro.
# En el panel: New → Blueprint, y Root Directory = apps/api
# (este archivo vive junto al Dockerfile).
services:
  - type: web
    name: jucaro-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: AUTO_APPROVE
        value: "false"
      - key: SITE_NAME
        value: Jucaro
      - key: DB_POOL_MAX
        value: "5"
      - key: STORAGE_DRIVER
        value: s3
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_PUBLIC_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-west-2
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
